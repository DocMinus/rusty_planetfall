[package]
name = "rustyz"
description = "Rusty Z: a Z-machine interpreter in a terminal-style window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zmachine = { path = "../zmachine" }
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
